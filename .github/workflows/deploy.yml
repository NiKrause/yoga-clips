name: Build & Deploy to Aleph IPFS

permissions:
  contents: read
  pull-requests: write
  statuses: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      relay_bootstrap_addr:
        description: >-
          Override relay bootstrap multiaddr(s) for production build.
          Comma-separated. Leave empty to use the default from .env.example.
        required: false
        default: ''
      domain:
        description: >-
          Aleph custom domain to link (e.g. yoga-clips.le-space.de).
          Leave empty to skip domain linking.
        required: false
        default: ''

jobs:
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 15
    steps:
      - name: Checkout yoga-clips
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: No preview origin is written down by hand
        run: pnpm run check:preview-origin

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:unit

      - name: E2E (shared playlist, permissions, export, deep link, consent, passkey steps)
        id: e2e
        run: >-
          pnpm exec playwright test
          e2e/clips-sharing.spec.js
          e2e/manual-multiaddr-connection.spec.js
          e2e/consent-identity-choice.spec.js
          e2e/passkey-steps.spec.js
          e2e/instagram-embed.spec.js
          --project=chromium

      - name: Summarize E2E
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          {
            echo '## end-to-end test'
            echo
            if [ "${E2E_OUTCOME}" = 'success' ]; then
              echo '**Result:** ✅ passed'
            else
              echo "**Result:** ❌ ${E2E_OUTCOME}"
            fi
            echo
            echo 'Chromium, a local OrbitDB relay, two isolated browser contexts with their own passkeys.'
            echo
            echo '| Verified behavior | Result |'
            echo '| --- | --- |'
            echo "| Alice creates a playlist and adds a clip | ${E2E_OUTCOME} |"
            echo "| Bob opens it by address, sees the clip, is refused when writing | ${E2E_OUTCOME} |"
            echo "| Alice grants Bob's DID; his clip replicates to Alice | ${E2E_OUTCOME} |"
            echo "| The export is a clips.json in the yoga-break schema | ${E2E_OUTCOME} |"
            echo "| ?clip=<id> opens the clip in the player; done marks stay local | ${E2E_OUTCOME} |"
            echo "| A copied own multiaddress connects a second browser | ${E2E_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-deploy:
    needs: e2e
    runs-on: ubuntu-latest
    outputs:
      ipfs_cid: ${{ steps.publish.outputs.ipfs_cid }}
      ipfs_cid_v0: ${{ steps.publish.outputs.ipfs_cid_v0 }}
      ipfs_cid_v1: ${{ steps.publish.outputs.ipfs_cid_v1 }}
      item_hash: ${{ steps.publish.outputs.item_hash }}
      store_status: ${{ steps.publish.outputs.store_status }}
      store_processed: ${{ steps.publish.outputs.store_processed }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      # A fork, a pull request from outside, or a fresh repository has no deploy
      # key. The build still runs as a check; publishing is skipped with one
      # clear line instead of failing after install, bootstrap and a full build
      # with "Missing required environment variable ALEPH_PRIVATE_KEY".
      - name: Is the deploy key there?
        id: key
        env:
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: |
          n=${#ALEPH_PRIVATE_KEY}
          if [ "$n" -ge 32 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "ALEPH_PRIVATE_KEY: set ($n characters)"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ALEPH_PRIVATE_KEY is not set ($n characters): the site is built but not published. Set it with: gh secret set ALEPH_PRIVATE_KEY --repo ${GITHUB_REPOSITORY}"
            echo '## Deploy skipped' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'No `ALEPH_PRIVATE_KEY` secret in this repository, so the build was only checked, not published to Aleph.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout yoga-clips
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve production bootstrap snapshot
        env:
          # Normal deployments discover the current Aleph relays. Only an explicit
          # workflow-dispatch input may override that snapshot.
          RELAY_BOOTSTRAP_OVERRIDE: ${{ inputs.relay_bootstrap_addr || '' }}
          # When discovery finds nothing (the registration lapsed, Aleph's API
          # is down), the production relay's known address is still probed and
          # baked if it answers. Same address as in .env.example.
          RELAY_BOOTSTRAP_FALLBACK: /dns4/crazy-pluck-uncle-device.2n6.me/tcp/443/tls/ws/p2p/12D3KooWQu5E1ZkGC5x2dSVTEWxYvsssWjXgk2Mzc8GZHN26cYzS
        run: node scripts/resolve-aleph-bootstrap.mjs

      - name: Build
        env:
          VITE_NODE_ENV: production
          VITE_APP_BRANCH: main
        run: pnpm build

      - name: Install isolated Aleph deploy tooling
        if: steps.key.outputs.deploy == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm install --prefix /tmp/le-space-deployer @le-space/node@0.12.4 --ignore-scripts

      - name: Publish to Aleph IPFS
        if: steps.key.outputs.deploy == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: publish
        env:
          ALEPH_VM_MODE: site-publish
          ALEPH_SITE_DIRECTORY: ${{ github.workspace }}/build
          ALEPH_SITE_PIN: 'true'
          ALEPH_SITE_NAME: yoga-clips
          ALEPH_SITE_CHANNEL: ALEPH-CLOUDSOLUTIONS
          # Every upload is storage the account pays for as long as it is
          # kept. The deployer forgets this site's uploads beyond the newest
          # three, and never one a domain still points at.
          ALEPH_SITE_RETENTION_KEEP_COUNT: '3'
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: |
          for attempt in 1 2 3; do
            if node --input-type=module -e "import('/tmp/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Aleph publish attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done

  link-domain:
    needs: build-and-deploy
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-and-deploy.outputs.item_hash != '' &&
      needs.build-and-deploy.outputs.store_processed == 'true'
    runs-on: ubuntu-latest
    env:
      ALEPH_MAIN_SITE_DOMAIN: yoga-clips.le-space.de
    steps:
      - name: Checkout yoga-clips
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install isolated Aleph deploy tooling
        run: npm install --prefix /tmp/le-space-deployer @le-space/node@0.12.4 --ignore-scripts

      - name: Link custom domain
        if: inputs.domain != '' || env.ALEPH_MAIN_SITE_DOMAIN != ''
        id: domain
        env:
          ALEPH_VM_MODE: site-domain-link
          ALEPH_SITE_NAME: yoga-clips
          ALEPH_SITE_CHANNEL: ALEPH-CLOUDSOLUTIONS
          # The deployer waits up to 20 minutes for the domain to serve the
          # new build over HTTPS and, by default, only warns when that runs
          # out. Here it fails: a deploy whose domain does not answer is not
          # a successful deploy.
          ALEPH_SITE_DOMAIN_VERIFY_ON_TIMEOUT: fail
          ALEPH_SITE_ITEM_HASH: ${{ needs.build-and-deploy.outputs.item_hash }}
          ALEPH_SITE_IPFS_CID: ${{ needs.build-and-deploy.outputs.ipfs_cid }}
          ALEPH_SITE_IPFS_CID_V0: ${{ needs.build-and-deploy.outputs.ipfs_cid_v0 }}
          ALEPH_SITE_DOMAIN: ${{ inputs.domain || env.ALEPH_MAIN_SITE_DOMAIN }}
          ALEPH_SITE_DOMAIN_CATCH_ALL_PATH: /index.html
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: node --input-type=module -e "import('/tmp/le-space-deployer/node_modules/@le-space/node/index.js').then((m) => m.runSiteMode())"
