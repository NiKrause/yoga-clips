name: Relink the custom domain on Aleph

# Run by hand, once: detaches the domain from the Aleph `domains` aggregate and
# attaches it again, so that Aleph's gateway sets it up anew. For a domain that
# was linked before its DNS records existed and still gets the gateway's
# default certificate. See scripts/relink-domain.mjs.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Custom domain to detach and attach again
        required: true
        default: yoga-clips.le-space.de
      wait_seconds:
        description: Pause between detach and attach
        required: false
        default: '120'
      certificate_wait_minutes:
        description: How long to wait for HTTPS on the domain afterwards
        required: false
        default: '15'

concurrency:
  group: aleph-domain
  cancel-in-progress: false

jobs:
  relink:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout yoga-clips
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install the signer
        run: npm install --prefix /tmp/relink ethers@6.16.0 --ignore-scripts --no-audit --no-fund

      - name: Detach and attach the domain
        id: relink
        env:
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
          ALEPH_SITE_DOMAIN: ${{ inputs.domain }}
          RELINK_WAIT_SECONDS: ${{ inputs.wait_seconds }}
          RELINK_MODULES: /tmp/relink
        run: node scripts/relink-domain.mjs

      - name: Wait for HTTPS on the domain
        env:
          DOMAIN: ${{ steps.relink.outputs.domain }}
          MINUTES: ${{ inputs.certificate_wait_minutes }}
        run: |
          subject() {
            echo | timeout 20 openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null \
              | openssl x509 -noout -subject 2>/dev/null || true
          }
          attempts=$(( ${MINUTES:-15} * 3 ))
          for i in $(seq 1 "$attempts"); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$DOMAIN/" 2>/dev/null || true)
            if [ "$code" = "200" ]; then
              echo "https://$DOMAIN answers 200 with a valid certificate: $(subject)"
              {
                echo "## Domain relinked"
                echo
                echo "\`$DOMAIN\` answers over HTTPS with a valid certificate."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$DOMAIN was relinked, but still has no valid certificate after ${MINUTES} minutes: $(subject)"
          {
            echo "## Domain relinked, certificate still missing"
            echo
            echo "\`$DOMAIN\` was detached and attached again. Aleph's gateway still serves: \`$(subject)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
