<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Theme init (before paint) — set light/dark from stored choice or system pref -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t !== 'light' && t !== 'dark') {
						t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.classList.toggle('dark', t === 'dark');
					document.documentElement.style.background = t === 'dark' ? '#0B0E15' : '#FAF6EE';
				} catch (e) {}
			})();
		</script>

		<!-- Favicon and Icons -->
		<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
		<link rel="icon" type="image/x-icon" href="./favicon.ico" />
		<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
		<link rel="manifest" href="./manifest.json" />
		<meta name="theme-color" content="#0B0E15" />

		<!-- SEO Meta Tags -->
		<title>Yoga Clips — short yoga clips from your favourite teachers, peer to peer</title>
		<meta
			name="description"
			content="Yoga Clips — a local-first peer-to-peer collection of short yoga clips (2–10 minutes) from your favourite teachers. No servers, no accounts — a passkey is your identity. Built with OrbitDB, IPFS and libp2p."
		/>
		<meta name="author" content="Nico Krause" />
		<meta
			name="keywords"
			content="yoga, clips, peer-to-peer, local-first, libp2p, orbitdb, ipfs, decentralized, p2p, le-space, yoga-break"
		/>

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://yoga-clips.le-space.de/" />
		<meta property="og:title" content="Yoga Clips — short yoga clips, peer to peer" />
		<meta
			property="og:description"
			content="A shared collection of short yoga clips from your favourite teachers. Local-first, no servers, no accounts. OrbitDB · IPFS · libp2p."
		/>
		<meta property="og:image" content="https://yoga-clips.le-space.de/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta
			property="og:image:alt"
			content="The Yoga Clips signet, a countdown arc around a play triangle, beside the wordmark yoga clips"
		/>
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:site_name" content="Yoga Clips" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:locale:alternate" content="de_DE" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://yoga-clips.le-space.de/" />
		<meta property="twitter:title" content="Yoga Clips — short yoga clips, peer to peer" />
		<meta
			property="twitter:description"
			content="A shared collection of short yoga clips from your favourite teachers. Local-first, no servers, no accounts. OrbitDB · IPFS · libp2p."
		/>
		<meta property="twitter:image" content="https://yoga-clips.le-space.de/og-image.png" />
		<meta
			property="twitter:image:alt"
			content="The Yoga Clips signet, a countdown arc around a play triangle, beside the wordmark yoga clips"
		/>

		<!-- Additional Meta Tags -->
		<meta name="application-name" content="Yoga Clips" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Yoga Clips" />
		<meta name="msapplication-TileColor" content="#0B0E15" />
		<meta name="msapplication-config" content="./browserconfig.xml" />

		<!-- Technical Meta Tags -->
		<meta name="format-detection" content="telephone=no" />

		<!-- Schema.org markup -->
		<meta itemprop="name" content="Yoga Clips — short yoga clips, peer to peer" />
		<meta
			itemprop="description"
			content="A local-first peer-to-peer collection of short yoga clips using OrbitDB, IPFS and libp2p. No servers, no accounts."
		/>
		<meta itemprop="image" content="https://yoga-clips.le-space.de/og-image.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
